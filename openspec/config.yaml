schema: conduction

context: |
  Project: Doriath
  Repo: ConductionNL/doriath
  Type: Nextcloud App (PHP backend + Vue 2 frontend)
  Description: Encrypted secrets manager for Nextcloud — stores and shares secrets (passwords, API keys)
    for users and applications using end-to-end RSA/AES encryption with a private Certificate Authority.
  Key components: Secrets, EncryptionSuites, CACertificates, Applications, Sharing (user/link/request)
  Database: PostgreSQL (own tables — does NOT use OpenRegister)
  Mount path: /var/www/html/custom_apps/doriath

  Architecture:
    Pattern: Thick backend — Doriath owns all database tables and handles all encryption server-side
    Data layer: Own Doctrine entities and migrations (no OpenRegister dependency)
    Encryption: RSA-4096 for secrets, AES-256 for private keys; always E2E (see ADR-003 revised)
    Frontend: Vue 2.7 + Pinia stores; browser users decrypt client-side via WebCrypto API
    Backend: Controllers, Services, and Entities; DecryptService + EncryptService (stateless crypto for internal NC apps)
    Master password: Never leaves the browser; AES-derived key and CryptoKey held in JS memory only

  Shared library: @conduction/nextcloud-vue (UI components only — CnDataTable, CnSettingsSection, etc.)
    Note: useObjectStore and OpenRegister-specific features do NOT apply (Doriath has own DB)

  Sister app: OpenConnector — uses Doriath as a secret store for connector API credentials
  Shared specs: See ../openspec/specs/ for cross-project conventions
  Project guidelines: See ../project.md for workspace-wide standards
  Architecture: See docs/ARCHITECTURE.md for standards research and data model decisions
  Features: See docs/FEATURES.md for competitive analysis and feature roadmap

rules:
  proposal:
    - Doriath owns its own database — do NOT reference OpenRegister for data storage
    - Security implications must be explicitly addressed for any feature touching encryption
    - Consider impact on OpenConnector where Doriath acts as a secret provider
    - Reference docs/FEATURES.md for feature tier (MVP/V1/Enterprise)
  specs:
    - Specify which fields are stored encrypted vs plain text
    - Specify which Nextcloud OCP interfaces are used for session, user, and auth integration
    - Encryption chunking constraints (RSA cap ~500 bytes/chunk) must be noted for large data fields
  design:
    - Always E2E — browser users decrypt client-side (WebCrypto); server never sees plaintext secrets or master password (see ADR-003 revised)
    - Internal NC apps use DecryptService/EncryptService (stateless crypto utilities, no entity context)
    - Private keys are never stored unencrypted — always AES-256 encrypted
    - Master password never leaves the browser; AES-derived key and CryptoKey held in JS memory only
    - Migrations must use Nextcloud's ISchemaWrapper pattern
    - MUST use @conduction/nextcloud-vue UI components (CnDataTable, CnSettingsSection, CnVersionInfoCard, CnDetailPage, CnObjectSidebar, etc.)
    - MUST NOT use useObjectStore or OpenRegister-specific features — Doriath has its own Pinia stores with client-side decrypt logic
    - MUST use CnDetailPage + CnObjectSidebar for secret detail views (card-based layout with sidebar)
    - MUST use CnSettingsSection + CnVersionInfoCard for admin settings page
    - MUST add @conduction/nextcloud-vue npm dependency (^0.1.0-beta.1) + conditional webpack alias + dedup aliases
    - MUST use NL Design System double-fallback CSS pattern (cn- prefix)
    - MUST use Vue Router (hash mode) for all navigation — never use custom hash-based routing
    - Router file at src/router/index.js, registered in main.js, <router-view /> in App.vue
    - Navigation via $router.push({ name, params, query }) in views; MainMenu uses :to prop on NcAppNavigationItem
    - Lock screen is a route guard — redirects to /lock when no CryptoKey in JS memory
    - "Detail views use route props functions: props: route => ({ secretId: route.params.id })"
    - Reference Nextcloud OCP interfaces for notifications (IManager), search (IProvider)
  tasks:
    - Test cross-implementation encryption round-trips (encrypt in JS/WebCrypto → decrypt in PHP/OpenSSL, and vice versa)
    - Test that the API never returns decrypted secret values (always encrypted blobs)
    - Test DecryptService and EncryptService in isolation (stateless, no DB calls)
  review:
    - Cross-reference shared specs (nextcloud-app, api-patterns, nl-design, docker)
    - Flag any pattern that stores a private key or master password unencrypted as a BLOCKER
    - Flag spec deviations from org-wide ADRs with WARNING and justification
    - ADR-001 (OpenRegister data layer) is explicitly superseded by Doriath ADR-001 for this app
