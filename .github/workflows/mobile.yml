name: Mobile

# The native apps' shared Kotlin Multiplatform core (clients-mobile-apps).
# The crypto vectors in tests/vectors/crypto/ are the contract between the
# core and the web app, so a change on either side runs both directions:
# the core reads what the web app wrote, and the web app reads what the core
# wrote in this same run.

on:
  push:
    branches: [main, development]
    paths:
      - "mobile/**"
      - "tests/vectors/**"
      - "tests/vitest/crypto-vectors*.spec.js"
      - "src/crypto/**"
      - "src/send/**"
      - "src/totp/**"
      - "src/passkey/**"
      - "src/generator/**"
      - "tests/vitest/generator-vectors.spec.js"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, development, beta]
    paths:
      - "mobile/**"
      - "tests/vectors/**"
      - "tests/vitest/crypto-vectors*.spec.js"
      - "src/crypto/**"
      - "src/send/**"
      - "src/totp/**"
      - "src/passkey/**"
      - "src/generator/**"
      - "tests/vitest/generator-vectors.spec.js"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships an Android SDK with ANDROID_HOME set and the
      # licences accepted; setup-android's sdkmanager run failed on it.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Shared core tests (jvm and Android unit tests)
        run: ./gradlew --no-daemon :shared:allTests
      # Both flavours (fdroid and play, task 6.1).
      - name: The app builds and links the shared core
        run: ./gradlew --no-daemon :android:app:assembleDebug
      # The flavours share every line of code, so the screen tests run once.
      - name: App screen tests on the JVM (Robolectric)
        run: ./gradlew --no-daemon :android:app:testFdroidDebugUnitTest
      - name: No Google Play Services or Firebase in the dependency tree
        run: |
          ./gradlew --no-daemon -q :shared:dependencies :android:app:dependencies > deps.txt
          if grep -E "com\.google\.android\.gms|com\.google\.firebase|credentials-play-services-auth" deps.txt; then
            echo "A proprietary Google artifact is in the dependency tree." >&2
            exit 1
          fi
          grep -q "kotlinx-serialization-json" deps.txt
          # The passkey provider (task 5.1) is androidx.credentials alone.
          grep -q "androidx.credentials:credentials:1" deps.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: The web app opens what the core wrote in this run
        working-directory: .
        run: |
          npm ci --ignore-scripts
          KEEPIQ_KOTLIN_VECTORS=mobile/shared/build/vectors/kotlin-output.json \
            npx vitest run tests/vitest/crypto-vectors.spec.js tests/vitest/crypto-vectors-kotlin.spec.js \
              tests/vitest/generator-vectors.spec.js
      # What the core wrote in this run. When its format changes on purpose,
      # this file replaces tests/vectors/crypto/kotlin-output.json.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kotlin-vectors
          path: mobile/shared/build/vectors/kotlin-output.json
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Shared core tests on the iOS simulator
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test
      - name: The iOS package links the shared framework
        run: |
          ./gradlew --no-daemon :shared:assembleKeepiqSharedReleaseXCFramework
          cd ios/KeepiqApp
          xcodebuild -scheme KeepiqApp -destination "generic/platform=iOS Simulator" build
      # The SwiftUI app itself (mobile/ios/project.yml), so a Swift compile
      # error shows in CI.
      - name: The iOS app compiles against the shared framework
        run: |
          ./gradlew --no-daemon :shared:assembleKeepiqSharedDebugXCFramework
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild build -project Keepiq.xcodeproj -scheme Keepiq \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -quiet
      # The Objective-C header Kotlin generates: the names Swift sees.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: keepiq-shared-header
          path: mobile/shared/build/XCFrameworks/debug/KeepiqShared.xcframework/*/KeepiqShared.framework/Headers/
          if-no-files-found: ignore
          retention-days: 14
