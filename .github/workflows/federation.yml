name: Federation (two instances)

# The two-instance test of federated sharing (sharing-federated-recipients
# task 5.1): two Nextcloud 35 containers on one network, each with Keepiq
# alone (it needs no other app, ADR-006), partners pinned on both sides, then a browser shares a secret
# from A to a user of B, B accepts and reads it, A updates it and revokes it.
# See tests/integration/federation/.

on:
  pull_request:
    branches: [main, development, beta]
    paths:
      - "lib/**"
      - "src/**"
      - "appinfo/**"
      - "tests/integration/federation/**"
      - ".github/workflows/federation.yml"
  push:
    branches: [development]
    paths:
      - "lib/**"
      - "src/**"
      - "appinfo/**"
      - "tests/integration/federation/**"
      - ".github/workflows/federation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-instances:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: keepiq
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm 11, which the lockfile needs (engines: npm ^11); Node 22
          # ships npm 10, whose `npm ci` misreads it.
          node-version: "24"

      - name: Build Keepiq
        working-directory: keepiq
        run: |
          composer install --no-dev --prefer-dist --no-interaction
          npm ci
          npm run build

      - name: Start the two instances
        run: docker compose -p kq-fed -f keepiq/tests/integration/federation/compose.yaml up -d
      - name: Provision both instances and pin the partners
        run: bash keepiq/tests/integration/federation/setup.sh kq-fed keepiq

      - name: Install the browser
        working-directory: keepiq
        run: |
          npx playwright install --with-deps chromium
      - name: Share, accept, update and revoke across the two instances
        working-directory: keepiq
        env:
          FED_A_URL: http://localhost:8101
          FED_B_URL: http://localhost:8102
        run: npx playwright test --config tests/integration/federation/playwright.config.ts

      - name: Server logs
        if: failure()
        run: |
          for side in a b; do
            echo "== instance ${side}"
            docker exec "kq-fed-nc-${side}-1" tail -n 200 /var/www/html/data/nextcloud.log || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: federation-playwright-report
          path: |
            keepiq/playwright-report-federation/
            keepiq/test-results-federation/
          if-no-files-found: ignore
