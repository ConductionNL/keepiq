name: Kubernetes operator

# Tests the operator in integrations/kubernetes on every pull request that
# touches it (unit and envtest, chart lint and snapshots, a kind cluster
# end to end), and releases it on a k8s-v* tag: a signed multi-arch image
# ghcr.io/conductionnl/keepiq-operator and the Helm chart as an OCI artifact in
# ghcr.io/conductionnl/charts. On a pull request the image is built, not pushed.

on:
  push:
    branches: [main, development]
    paths: ["integrations/kubernetes/**", "sdk/go/**", "sdk/testdata/**", "cli/**", ".github/workflows/integrations-kubernetes.yml"]
    tags: ["k8s-v*"]
  pull_request:
    branches: [main, development, beta]
    paths: ["integrations/kubernetes/**", "sdk/go/**", "sdk/testdata/**", "cli/**", ".github/workflows/integrations-kubernetes.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # envtest starts a real kube-apiserver and etcd; a cold module cache is
    # the slow part.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/kubernetes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: integrations/kubernetes/go.sum
      - run: go vet ./...
      - name: envtest binaries
        run: |
          go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19 use 1.30.0 --bin-dir "$RUNNER_TEMP/envtest" -p path > "$RUNNER_TEMP/assets"
          echo "KUBEBUILDER_ASSETS=$(cat "$RUNNER_TEMP/assets")" >> "$GITHUB_ENV"
      - run: go test ./...

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - run: bash integrations/kubernetes/test/chart.sh

  kind:
    needs: [test, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Build images
        run: |
          docker build -f integrations/kubernetes/Dockerfile -t keepiq-operator:e2e .
          mkdir -p cli/dist
          (cd cli && CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=e2e" -o dist/keepiq-linux-amd64 .)
          docker build -f cli/Dockerfile -t keepiq-cli:e2e cli
      - run: bash integrations/kubernetes/test/kind.sh

  release:
    if: startsWith(github.ref, 'refs/tags/k8s-v')
    needs: kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#k8s-v}" >> "$GITHUB_OUTPUT"
      - name: Chart version matches the tag
        run: |
          grep -qx "version: ${{ steps.v.outputs.version }}" integrations/kubernetes/charts/keepiq-operator/Chart.yaml
          grep -qx "appVersion: \"${{ steps.v.outputs.version }}\"" integrations/kubernetes/charts/keepiq-operator/Chart.yaml
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/kubernetes/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/conductionnl/keepiq-operator:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ConductionNL/keepiq
            org.opencontainers.image.licenses=EUPL-1.2
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/conductionnl/keepiq-operator@${{ steps.build.outputs.digest }}"
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Push the chart
        run: |
          helm package integrations/kubernetes/charts/keepiq-operator -d "$RUNNER_TEMP/chart"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP/chart/keepiq-operator-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/conductionnl/charts
