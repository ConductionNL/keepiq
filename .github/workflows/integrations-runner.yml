name: Rotation and sync runner

# Tests keepiq-runner (integrations/runner) on every pull request that touches
# it, including the PostgreSQL and MySQL connectors against real servers, and
# releases it on a runner-v* tag: static binaries with SHA256SUMS on the
# release, and a cosign-signed multi-arch image ghcr.io/conductionnl/keepiq-runner.
# On a pull request the binaries and the image are built, not published.

on:
  push:
    branches: [main, development]
    paths: ["integrations/runner/**", "sdk/go/**", "sdk/testdata/**", ".github/workflows/integrations-runner.yml"]
    tags: ["runner-v*"]
  pull_request:
    branches: [main, development, beta]
    paths: ["integrations/runner/**", "sdk/go/**", "sdk/testdata/**", ".github/workflows/integrations-runner.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: pg-admin-pass}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: my-admin-pass}
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -uroot -pmy-admin-pass" --health-interval 5s --health-retries 30
    defaults:
      run:
        working-directory: integrations/runner
    env:
      KEEPIQ_TEST_POSTGRES: "127.0.0.1:5432 postgres pg-admin-pass"
      KEEPIQ_TEST_MYSQL: "127.0.0.1:3306 root my-admin-pass"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: integrations/runner/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: Static binaries
        working-directory: integrations/runner
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/keepiq-runner-$os-$arch$ext" ./cmd/keepiq-runner
          done
          (cd dist && sha256sum keepiq-runner-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keepiq-runner
          path: integrations/runner/dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/runner-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: integrations/runner/dist/*

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/runner-v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: integrations/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/runner-v') }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/conductionnl/keepiq-runner:${{ startsWith(github.ref, 'refs/tags/runner-v') && github.ref_name || 'pr' }}
          labels: |
            org.opencontainers.image.source=https://github.com/ConductionNL/keepiq
            org.opencontainers.image.licenses=EUPL-1.2
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: startsWith(github.ref, 'refs/tags/runner-v')
      - name: Sign the image (keyless)
        if: startsWith(github.ref, 'refs/tags/runner-v')
        run: cosign sign --yes "ghcr.io/conductionnl/keepiq-runner@${{ steps.build.outputs.digest }}"
