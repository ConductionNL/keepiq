name: Extension release

# Builds, tests and packs the browser extension per store target
# (extension-store-release). On pull requests and pushes it proves the
# packages build twice to the same bytes and lints the Firefox one; store
# credentials are not reachable there. On an `extension-v<version>` tag a
# second job, bound to the protected `extension-stores` environment that a
# maintainer approves, submits the packages to the Chrome Web Store, Firefox
# Add-ons and Edge Add-ons and attaches them to a GitHub release.
#
# Firefox Add-ons signs the listed package only after its review, which takes
# hours to days. A third job, `attach-amo-signed`, runs daily and on demand: once
# a released version is approved, it downloads the file Firefox Add-ons signed,
# checks it holds exactly the files of the package the release job built, and
# attaches it to the same GitHub release for administrators who host it
# themselves. It reads only public Firefox Add-ons data, so it needs no store
# credential and no environment approval.
#
# Store credentials and who approves the environment: docs/browser-extension-release.md.

on:
  push:
    branches: [main, development]
    tags: ["extension-v*"]
    paths: ["browser-extension/**", "src/crypto/**", "src/totp/**", "src/policy/**", "src/health/**", ".github/workflows/extension-release.yml"]
  pull_request:
    branches: [main, development, beta]
    paths: ["browser-extension/**", "src/crypto/**", "src/totp/**", "src/policy/**", "src/health/**", ".github/workflows/extension-release.yml"]
  schedule:
    # Daily check for Firefox Add-ons approvals of released versions.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      amo_version:
        description: "Attach the Firefox Add-ons signed file for this released version (for example 1.2.0); leave empty to build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.amo_version == '')
    runs-on: ubuntu-latest
    # Tests, two builds per target, a lint and a zip; minutes at most.
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Extension tests
        run: npx vitest run tests/extension
      - name: Version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/extension-v* ]]; then
            v="${GITHUB_REF#refs/tags/extension-v}"
          else
            v="$(node -p "require('./browser-extension/manifest.json').version")"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build each target twice and compare
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for run in a b; do
            for target in chrome firefox; do
              node browser-extension/build.mjs --target "$target" --outdir "out/$run"
            done
          done
          ( cd out/a && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) > a.sha
          ( cd out/b && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) > b.sha
          diff -u a.sha b.sha
      - name: Lint the Firefox package
        run: npx --yes web-ext@8.3.0 lint --source-dir out/a/firefox --warnings-as-errors=false
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p packages
          for dir in chromium firefox; do
            ( cd "out/a/$dir" \
              && find . -exec touch -h -d '1980-01-01T00:00:00Z' {} + \
              && find . -type f | LC_ALL=C sort | zip -X -q -@ "../../../packages/keepiq-$dir-$VERSION.zip" )
          done
          # Firefox Add-ons reviews bundled code against its source.
          git archive --format=zip -o "packages/keepiq-extension-source-$VERSION.zip" HEAD \
            browser-extension src/crypto src/totp src/policy src/health package.json package-lock.json
          sha256sum packages/* | tee packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: keepiq-extension-${{ steps.version.outputs.version }}
          path: packages/
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    # Uploads and store API calls; store review itself happens later.
    timeout-minutes: 30
    environment: extension-stores
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keepiq-extension-${{ needs.build.outputs.version }}
          path: packages
      - name: Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload --auto-publish \
            --source "packages/keepiq-chromium-$VERSION.zip" \
            --extension-id "$EXTENSION_ID" --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" --refresh-token "$REFRESH_TOKEN"
      - name: Firefox Add-ons (listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p firefox && unzip -q "packages/keepiq-firefox-$VERSION.zip" -d firefox
          npx --yes web-ext@8.3.0 sign --channel listed --source-dir firefox \
            --upload-source-code "packages/keepiq-extension-source-$VERSION.zip" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 0 --artifacts-dir signed
      - name: Edge Add-ons
        env:
          PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          api="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"
          auth=(-H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID")
          op=$(curl -fsS -D - -o /dev/null "${auth[@]}" -H "Content-Type: application/zip" \
            --data-binary "@packages/keepiq-chromium-$VERSION.zip" "$api/draft/package" \
            | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
          for i in $(seq 1 30); do
            status=$(curl -fsS "${auth[@]}" "$api/draft/package/operations/$op" | jq -r .status)
            [ "$status" = "Succeeded" ] && break
            [ "$status" = "Failed" ] && { echo "Edge package upload failed"; exit 1; }
            sleep 10
          done
          curl -fsS "${auth[@]}" -X POST -H "Content-Type: application/json" \
            -d "{\"notes\":\"Keepiq $VERSION\"}" "$api"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*
            signed/*

  attach-amo-signed:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.amo_version != '')
    runs-on: ubuntu-latest
    # A few small downloads per release; the scheduled run looks at the last five.
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED: ${{ inputs.amo_version }}
      # The add-on id in the Firefox manifest (browser-extension/manifests/browsers.mjs).
      GECKO_ID: keepiq@conduction.nl
    steps:
      - name: Attach the signed Firefox file to approved releases
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            versions="$REQUESTED"
          else
            versions=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName \
              -q '[.[].tagName | select(startswith("extension-v")) | ltrimstr("extension-v")] | .[0:5][]')
          fi
          for v in $versions; do
            tag="extension-v$v"
            asset="keepiq-firefox-$v-amo-signed.xpi"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$asset"; then
              echo "$tag already holds $asset"
              continue
            fi
            # The public version detail answers only for a listed version that passed review.
            code=$(curl -sS -o amo.json -w '%{http_code}' \
              "https://addons.mozilla.org/api/v5/addons/addon/$GECKO_ID/versions/v$v/")
            status=$(jq -r '.file.status // empty' amo.json 2>/dev/null || true)
            if [ "$code" != "200" ] || [ "$status" != "public" ]; then
              echo "::notice::Firefox Add-ons has not approved $v yet (HTTP $code, file status '${status:-none}')"
              if [ -n "$REQUESTED" ]; then exit 1; fi
              continue
            fi
            url=$(jq -r '.file.url' amo.json)
            expected=$(jq -r '.file.hash' amo.json)
            case "$url" in
              https://addons.mozilla.org/*) ;;
              *) echo "::error::Unexpected download host in $url"; exit 1 ;;
            esac
            curl -fsSL -o "$asset" "$url"
            actual="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$asset hash $actual does not match Firefox Add-ons ($expected)"
              exit 1
            fi
            # The signed file must be the package this release built, plus the signature.
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "keepiq-firefox-$v.zip" --clobber
            rm -rf built signed && mkdir built signed
            unzip -q "keepiq-firefox-$v.zip" -d built
            unzip -q "$asset" -d signed
            ls signed/META-INF/mozilla.rsa signed/META-INF/cose.sig > /dev/null
            ( cd built && find . -type f | LC_ALL=C sort | xargs sha256sum ) > built.sha
            ( cd signed && find . -type f ! -path './META-INF/*' | LC_ALL=C sort | xargs sha256sum ) > signed.sha
            if ! diff -u built.sha signed.sha; then
              echo "::error::$asset does not hold exactly the files of keepiq-firefox-$v.zip"
              exit 1
            fi
            sha256sum "$asset" > "$asset.sha256"
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$asset" "$asset.sha256"
            echo "Attached $asset to $tag"
          done
