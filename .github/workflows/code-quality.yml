name: Code Quality

on:
  push:
    # DEFAULT BRANCHES ONLY. `pull_request` below carries every other branch.
    #
    # This was an allow-list of branch prefixes, and that was a gate with a
    # SILENT hole: a branch matching nothing got no CI at all, and its last
    # visible status was whatever it inherited — indistinguishable, on every
    # dashboard, from a branch that passed. Two live examples, both found
    # 2026-08-14: `perf/**` was uncovered in openconnector, where a merge
    # carrying unresolved conflict markers and 84 failing tests was pushed and
    # nothing ran; and `feat/**` was uncovered in openregister, because the
    # list said `feature/**`.
    #
    # What forced it now: a push to a branch with an open PR ran the SAME 34
    # jobs TWICE on the same commit. `concurrency` cannot dedupe them — the
    # group is suffixed by event name deliberately (.github#540: a
    # default-branch push carries jobs a PR run does not, and a dispatch must
    # not be cancellable by a standing release PR), so the two events sit in
    # different lanes BY DESIGN and both run to completion. Measured fleet-wide
    # 2026-08-25..27, 659 of 2,106 Code Quality runs were that duplicate — 31%
    # of the fleet's most expensive workflow, re-deciding a commit another run
    # was already deciding. The account ceiling is 60 concurrent jobs (Team
    # plan); the fleet was measured at 53 running with 1,528 jobs queued behind
    # them, the oldest run 7 hours old and not yet started.
    #
    # NO BRANCH LOSES ITS FLOOR. merge-hygiene.yml runs on `'**'` — every
    # branch anyone pushes, no prefix list to forget — and it is the check
    # `development` actually requires. That is the smoke alarm; this workflow
    # is the fire brigade and belongs on the PR. Of 668 feature-branch push
    # runs in that window, only NINE were on a branch with no PR run beside
    # them.
    #
    # The default branches STAY: their push runs are not duplicates, they are
    # the only carrier of Coverage Baseline Check, SBOM and Features Extract,
    # none of which run on a pull_request event.
    branches:
      - main
      - development
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

concurrency:
  # SUFFIXED BY EVENT NAME, not just by `-push`.
  #
  # The previous expression gave a push on `development` its own lane
  # (`-push`) but left EVERYTHING ELSE sharing `quality-development` — and
  # that is not a quiet lane: `Sync to Beta` keeps a PR open whose head_ref
  # IS `development`, so its run computes the same group and is re-triggered
  # on every merge.
  #
  # A `workflow_dispatch` therefore shared a group with that PR and was
  # cancelled by it. Measured on shillinq 2026-08-21: dispatch 32487948678
  # cancelled by pull_request run 32490160836 (head_branch `development`).
  # A run someone deliberately asked for could essentially never complete.
  #
  # That reaches past ad-hoc verification: the fleet gate-drift sweep
  # (.github#523) dispatches per app with `--ref development`, because
  # `schedule:` cannot choose a branch. Under the old group those runs are
  # cancelled and report neither pass nor fail — and a routine that produces
  # no verdict is indistinguishable from one that never ran.
  #
  # Pull requests keep the bare group (so a PR still supersedes its own
  # earlier run); push, dispatch and schedule each get their own lane.
  #
  # The suffix used to apply only when `ref_name` was `main` or `development`,
  # so on every OTHER branch push and pull_request computed the SAME group —
  # and `cancel-in-progress` made them kill each other. That became reachable
  # when the push allow-list widened on 2026-08-14 to include `feat/**`,
  # `fix/**`, `perf/**`, `refactor/**` and `chore/**`: those branches now get
  # both a push run and a pull_request run for one commit.
  #
  # `quality / Quality Report` is a `needs:`-gated aggregator and reports
  # FAILURE when its dependencies are CANCELLED, so the collision shows up as a
  # red gate on a PR that was never actually evaluated — and re-running collides
  # the same way. Measured on openregister#2821: a push run left queued and a
  # pull_request run cancelled, 18 seconds apart, on one commit.
  #
  # A branch name is not a unique lane when two event types can each produce a
  # run for it, so the event is now always part of the key.
  group: quality-${{ github.head_ref || github.ref_name }}${{ github.event_name != 'pull_request' && format('-{0}', github.event_name) || '' }}

  # PUSH RUNS ARE NOT CANCELLED — and this has to be said HERE, not only in the
  # shared workflow. .github#597 set `cancel-in-progress` on quality.yml itself,
  # but a caller's own concurrency cancels the whole run before the called
  # workflow's setting can apply, so that fix reached only the apps that declare
  # no concurrency of their own. Measured 2026-08-28 over push runs on
  # `development` since #597: 0 of 11 cancelled where the caller was silent, 7 of
  # 13 (54%) cancelled where the caller still said `true`.
  #
  # An integration branch needs a verdict per commit: the run being cancelled is
  # the only thing that would have said whether what just landed is sound, and
  # its replacement is cancelled too. `pull_request` keeps cancelling, where
  # superseding really is correct.
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write).
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    # Skips the standing "development → beta" sync PR, which would otherwise
    # re-run the whole pipeline on every merge into development.
    if: (github.event_name != 'pull_request' || github.head_ref != 'development')
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: keepiq
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      # NO `nextcloud-test-refs` HERE, DELIBERATELY. The shared workflow derives
      # the matrix from appinfo/info.xml when this input is unset, and a derived
      # matrix cannot disagree with the declared range. The override that used to
      # sit here is exactly how the two came apart: it read
      # `["stable34", "stable32", "stable33"]` while this branch moved info.xml to
      # `<nextcloud min-version="32" max-version="35"/>`, so NC 35 was advertised
      # to the App Store with no job touching it — not known-broken, unmeasured.
      # gate-65 rule 11 is what caught it. Re-adding stable35 by hand fixes today
      # and leaves the next bump to be remembered in two files; deriving deletes
      # the second file.
      #
      # WHAT THE OVERRIDE WAS PROTECTING, AND WHY IT NO LONGER HAS TO.
      # Its ORDER carried meaning: E2E (Playwright), Newman and journeydoc-capture
      # each ran against `fromJSON(nextcloud-test-refs)[0]`, so stable34 had to
      # lead to keep them off a server OpenRegister cannot load — OpenRegister's
      # lib/ContextChat/ContentProvider.php implements
      # `OCP\ContextChat\IContentProvider`, which does not exist before stable32,
      # and on stable31 every `occ` invocation printed
      # `Interface "OCP\ContextChat\IContentProvider" not found` while loading
      # commands from openregister's info.xml.
      #
      # Those four jobs no longer read a meaning off a position. The shared
      # workflow computes a `single-server` output — the numerically HIGHEST
      # stable branch in the resolved set, and for the derived path the matrix
      # action's own `branches-max` — and they consume that. The action's
      # `branches` output is OLDEST-first, so a positional read would have moved
      # all four onto stable32 silently. List order is now inert, and the one
      # thing the override bought is structural instead.
      #
      # THIS ADDS A stable35 LEG. It was RED BEFORE IT WAS GREEN, deliberately.
      # `additional-apps` below installs openregister and integriq, and when this
      # branch was opened (2026-09-15) BOTH still declared `max-version="34"` on
      # `development`. The shared workflow aborts the job when `occ app:enable`
      # fails for an additional app — that was once only a ::warning::, which is
      # how a leg previously ran on WITHOUT OpenRegister loaded and reported
      # nothing — so the stable35 legs failed at the fixture, not in the tests.
      #
      # RESOLVED 2026-09-24: both dependencies now declare
      # `<nextcloud min-version="32" max-version="35"/>` on `development`, which
      # is the ref this file pins. Verified by parsing each appinfo/info.xml
      # rather than grepping, because both files carry comments that quote OTHER
      # apps' ranges and a grep matches those first.
      #
      # The point of deriving the matrix from info.xml stands: the red was the
      # honest state of NC 35 support while the gap existed, and nothing here
      # could hide it. Leave it derived.
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # Keepiq adopts OpenRegister's AppHost engine in lib/AppInfo/Application.php
      # (ADR-040 / ADR-022) and ships lib/Settings/keepiq_register.json, so
      # OpenRegister must be present in the test instance — otherwise
      # SettingsService::isOpenRegisterAvailable() is false, InitializeSettings
      # skips the register import with a warning, and the app boots without the
      # host engine it delegates to.
      #
      # NOTE the org is ConductionNL, not Conduction. `Conduction` does not
      # exist, and the shared workflow clones additional-apps UNAUTHENTICATED —
      # so a bad ref does not report a clean 404. git falls through to
      # credential prompting and the step dies with
      #   fatal: could not read Username for 'https://github.com'  (exit 128)
      # which reads as an auth problem rather than a typo. Six fleet repos hit
      # this; in pipelinq it killed all four PHPUnit legs and the E2E job at the
      # clone step, so those gates had never executed a single test.
      #
      # integriq is here because the Integrations page reads integriq's
      # `app_connection` rows (adopt-connection-registry). Without it the page
      # shows the missing-dependency screen and
      # `tests/e2e/workflows/integrations-page.spec.ts` fails on every run.
      # `app` is `integriq`, verified in its appinfo/info.xml on `development`
      # on 2026-09-15.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"},{"repo":"ConductionNL/integriq","app":"integriq","ref":"development"}]'
      enable-sbom: true

      # ── Licensing ────────────────────────────────────────────────────────
      # REUSE findings fail the build. The shared workflow defaults this OFF
      # because most fleet apps ship no REUSE.toml or LICENSES/ directory;
      # keepiq ships both and lints at 1467/1467, 0 missing, 0 unused,
      # compliant with version 3.3 of the REUSE specification.
      #
      # The blanket `path = "**"` annotation in REUSE.toml makes every new file
      # compliant on arrival, whatever its type, so ordinary work cannot trip
      # this. One regression mode remains — vendoring a file whose own SPDX
      # header names a licence with no text in LICENSES/ — and non-blocking
      # that surfaces only as REUSE ❌ in the Quality Report comment, which is
      # easy to miss.
      reuse-blocking: true

      # ── E2E browser tests ────────────────────────────────────────────────
      # `playwright-test-path` does double duty in the shared workflow:
      #   1. it is the directory the "Validate Playwright tests exist" step
      #      counts *.spec.ts in;
      #   2. it is the FIRST place the run step looks for a config —
      #      `${playwright-test-path}/playwright.config.ts`, falling back to
      #      the repo root only if that file is absent.
      # We ship tests/e2e/playwright.config.ts precisely so lookup (2) hits it.
      # The run step passes no `--project`, so the root config would run BOTH
      # of its projects — including `visual`, whose own header records that a
      # CI Linux runner cannot byte-match a dev-container PNG baseline. The
      # tests/e2e config declares only the chromium regression project and
      # writes its report to the app root, where the workflow's
      # upload-artifact steps actually look.
      enable-playwright: true
      playwright-test-path: tests/e2e
      # Keepiq's nine workflow specs UNLOCK the vault with the development
      # master password seeded by lib/Repair/SeedDevelopmentData.php — and that
      # repair step returns immediately unless the `debug` system config is
      # true, which `occ maintenance:install` does not set. A stock CI install
      # therefore comes up with no dev vault at all and nothing exits non-zero.
      # The script turns debug on, re-runs the repair steps, imports the
      # register through OpenRegister's admin API, and fails loudly if the
      # suite / secrets / schemas still aren't there.
      # cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/keepiq/tests/e2e/ci-seed.sh'

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so these two validators
      # ran nowhere while the run still looked complete. Both are self-contained
      # `node` scripts, which is what a leg has to be (each leg is a fresh job
      # with its own checkout + `npm ci`).
      # `test` / `test:unit` are NOT listed: the shared "Frontend Tests (unit)"
      # job already auto-detects and runs them.
      #
      # `format` (prettier --check) is listed because the shared workflow has NO
      # prettier job of its own — `quality.yml` runs eslint and stylelint and
      # mentions prettier ZERO times. This repo already carries
      # `@nextcloud/prettier-config` and a `format` script, so without this leg
      # `npm run format` never runs outside a developer's editor and the tree
      # drifts straight back out of format between merges — the same inert-
      # formatter failure mode that made the old `.prettierrc` worth deleting.
      # Centralising the config never stopped drift; the gate does.
      # Measured on this tree before enabling: PASSES, 294 of 310 tracked
      # frontend files in scope. This repo has TWO documentation trees and both
      # are excluded by .prettierignore — `docs/` and the separate `docusaurus/`
      # site, which has its own package.json and its own toolchain.
      # `check:l10n-js` regenerates l10n/<locale>.js from the JSON catalogue and
      # fails when the committed file is stale. Nextcloud serves ONLY the JS half
      # to a browser — raw JSON out of an app directory is a 404 — so a catalogue
      # that exists only as JSON renders English in the entire UI while every
      # server-rendered string is translated, with no error anywhere.
      # `check:schema-l10n` is a RATCHET, not a gate. Every string inside a form
      # comes from the schema and is a key in THIS app's catalogue; an absent key
      # renders the English source inside an otherwise translated form, silently.
      # The fleet had 30,459 such strings, so this records the current count and
      # fails only when it GROWS — burning it down stays an ordinary PR.
      frontend-checks: '["check:manifest", "test:l10n", "format", "check:l10n-js", "check:schema-l10n"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" (PR side) and "Coverage Baseline Check"
      # (push side) have only ever reported `skipped`. It needs two inputs this
      # repo did not have, both added in this commit:
      # `scripts/coverage-guard.php` (byte-identical to the copies in
      # openregister and procest) and `.coverage-baseline` = 55.78, this repo's
      # own measured coverage (6838 of 12258 statements) read from clover.xml
      # in the `coverage-report` artifact of run 30911329266.
      enable-coverage-guard: true

      # ── Hydra mechanical gates ───────────────────────────────────────────
      # `enable-hydra-gates` defaults to FALSE, so this tier has never executed
      # here — the job reported `skipped`, which the Quality Report renders
      # identically to a pass.
      # `enable-axe` deliberately NOT set: a vanilla Nextcloud 34 already carries
      # serious/critical violations on core's OWN routes that DOM scoping does
      # not remove. Enabling axe is a separate decision. Note that gate-33
      # (axe-core) reads tests/axe/report.json, which the Playwright job writes
      # ONLY when `enable-axe: true` — un-skipping Playwright is not the fix;
      # with axe off the gate declares itself not applicable.
      enable-hydra-gates: true
      # No `hydra-gates-ref` here on purpose. The shared workflow defaults it
      # to @main, and this workflow is itself consumed at @main, so the two
      # sides move together and a gate fix reaches this repo without a commit
      # in this repo. A pin is a silent expiry date: 22 repos sat on v1.0.1 and
      # 16 gates were dead fleet-wide while every one reported PASS (.github#159),
      # and a default flipped at @main later reached those old runners and made
      # them red on gates they had no subject matter for (.github#173).
      # To hold this repo still for a specific reason, set the input explicitly
      # and say why — it is still honoured. To roll back for everyone, revert on
      # ConductionNL/.github main.
      # ── Cost controls (see ConductionNL/.github#596, #599) ───────────────
      # Run PHPUnit and Playwright only when the diff could change their
      # verdict. Fails safe TOWARDS running: an unreadable diff, a force-push,
      # a branch creation or a dispatch all run everything, and a filtered
      # skip is a declared state in the Quality Report, not a missing one.
      enable-path-filtering: true
      # PR-time PHPUnit runs the primary PHP against the newest declared
      # Nextcloud; the full matrix still runs on every push to a default
      # branch and on the release PR into beta. Breadth moves from
      # per-commit to per-merge, it is not dropped.
      reduce-pr-matrix: true
