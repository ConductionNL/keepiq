name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege for the called quality pipeline: the Quality Report job
# posts a sticky PR comment (issues/pull-requests write); everything else
# only reads the checkout.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: doriath
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # additional-apps: '[]'  # Add app dependencies here if needed, e.g.:
      # additional-apps: '[{"repo":"Conduction/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true
