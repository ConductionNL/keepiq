name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: doriath
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      # stable31 dropped with the NC floor raise to 32. The floor is enforced at INSTALL
      # time, so `occ app:enable` refuses on NC 31 — but the shared workflow runs app-enable
      # as `|| echo "::warning::..."`, so that refusal is only a warning. The job then
      # continues without its data layer and dies ~70s later on missing schemas, which
      # reads like an app/migration fault rather than an unsatisfiable dependency.
      # Order matters too: the newman/playwright/journeydoc jobs check the server out at
      # fromJSON(inputs.nextcloud-test-refs)[0].
      nextcloud-test-refs: '["stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # additional-apps: '[]'  # Add app dependencies here if needed, e.g.:
      # additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true
