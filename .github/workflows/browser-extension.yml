name: Browser extension

# Tests, typechecks, lints and builds the WXT extension in browser-extension/
# for Chromium MV3, Firefox MV2 and Safari MV3, and packages the Safari build in
# its macOS app. The crypto tests read the web app's vectors, so a change to
# those runs this too.

on:
  push:
    branches: [main, development]
    paths: ["browser-extension/**", "tests/vectors/crypto/**", ".github/workflows/browser-extension.yml"]
  pull_request:
    branches: [main, development, beta]
    paths: ["browser-extension/**", "tests/vectors/crypto/**", ".github/workflows/browser-extension.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    # Tests, two builds and a lint; minutes at most.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      # No install scripts from dependencies; `wxt prepare` is the one postinstall we need.
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - name: No chrome.* in executable code
        run: |
          if grep -rnE '(^|[^.[:alnum:]_])chrome\.' src entrypoints --include='*.ts' --include='*.tsx' | grep -vE '^\S+:[0-9]+:\s*(//|\*|/\*)'; then
            echo "::error::Use browser.* instead of chrome.* (WXT-AND-BROWSERS.md § 1)"
            exit 1
          fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run build:firefox
      - name: Lint the Firefox package
        run: npx web-ext lint --source-dir .output/firefox-mv2 --warnings-as-errors=false
      # Shows a Safari build break here, without waiting for the macOS job.
      - run: npm run build:safari
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension
          path: |
            browser-extension/.output/chrome-mv3/
            browser-extension/.output/firefox-mv2/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    # A build and the inline list in headless Chromium; Playwright cannot load extensions into Firefox.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension-e2e
          path: browser-extension/test-results/
          retention-days: 14

  safari:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx wxt prepare
      - run: npm run build:safari
      - name: Native handler tests
        run: |
          swiftc -o "$RUNNER_TEMP/handler-tests" safari/SafariWebExtensionHandler.swift safari/tests/main.swift
          "$RUNNER_TEMP/handler-tests"
      - run: npm run package:safari
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Smoke test in Safari
        # Not required until its first green run (ext-safari tasks.md 6.3).
        continue-on-error: true
        env:
          SAFARI_SMOKE_SCREENS: ${{ runner.temp }}/safari-diagnostics
        run: |
          npm run test-site &
          safaridriver --port 4444 --diagnose &
          # What the screen shows while it runs: a prompt or sheet would not reach the WebDriver log.
          mkdir -p "$RUNNER_TEMP/safari-diagnostics"
          ( for i in $(seq -w 1 30); do screencapture -x "$RUNNER_TEMP/safari-diagnostics/screen-$i.png" || true; sleep 4; done ) &
          npm run test:safari-smoke
      - name: Collect Safari's system log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/safari-diagnostics"
          log show --last 15m --style compact --predicate 'process == "Safari" OR process BEGINSWITH "com.apple.WebKit" OR process == "safaridriver"' > "$RUNNER_TEMP/safari-diagnostics/system.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension-safari
          path: |
            browser-extension/.output/safari-mv3/
            browser-extension/.output/keepiq-safari.zip
          retention-days: 14
      # What safaridriver saw, also when an earlier step failed.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension-safari-webdriver-logs
          path: |
            ~/Library/Logs/com.apple.WebDriver/
            ${{ runner.temp }}/safari-diagnostics/
          retention-days: 14
