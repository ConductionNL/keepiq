name: CLI Release

# Builds the keepiq-cli single static binary for every supported platform.
# On a tag push it also uploads the artifacts to the GitHub release, with a
# SHA256SUMS file that the GitHub Action and the GitLab template check every
# download against, and pushes the container image ghcr.io/conductionnl/keepiq-cli
# at the same version. The CLI is pure Go: the standard library, sdk/go in this
# repository, and the Go project's golang.org/x/crypto and golang.org/x/sys for
# the SSH agent. The matrix is a plain cross-compile with no PHP or Node needed.

on:
  push:
    branches: [main, development]
    paths: ["cli/**", "sdk/go/**", "sdk/testdata/**", ".github/workflows/cli-release.yml"]
    tags: ["cli-v*"]
  pull_request:
    branches: [main, development, beta]
    paths: ["cli/**", "sdk/go/**", "sdk/testdata/**", ".github/workflows/cli-release.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # No observed runs yet; vet, test and govulncheck of the CLI are minutes at most.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go vet ./...
      # The SSH agent's integration test runs the real ssh client against a
      # throwaway sshd on localhost (cli-ssh-agent).
      - name: Install OpenSSH for the agent integration test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server openssh-client && sudo mkdir -p /run/sshd
      - run: go test ./...
      # The CLI now has dependencies: check them for known vulnerabilities.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    # No observed runs yet; a pure-Go cross-compile is minutes at most.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build static binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="keepiq-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" .
          echo "ARTIFACT=cli/$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: keepiq-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: ${{ env.ARTIFACT }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}

  checksums:
    # One SHA256SUMS over every binary, attached to the release. On a branch or
    # pull request it is built and uploaded as an artifact only (the dry run).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: keepiq-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum keepiq-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS

  image:
    # ghcr.io/conductionnl/keepiq-cli: the linux binaries on a distroless static
    # base, multi-arch, tagged with the release version. Pushed on a cli-v tag;
    # built without pushing otherwise (the dry run).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: keepiq-linux-*
          merge-multiple: true
          path: cli/dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          echo "tags=ghcr.io/conductionnl/keepiq-cli:${version},ghcr.io/conductionnl/keepiq-cli:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/cli-v') }}
          load: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/ConductionNL/keepiq
            org.opencontainers.image.description=keepiq CLI, the zero-knowledge Keepiq command-line client
            org.opencontainers.image.licenses=EUPL-1.2
      - name: Smoke test the amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t keepiq-cli:smoke -f cli/Dockerfile cli
          docker run --rm keepiq-cli:smoke --version
