name: Client libraries

# Tests the Go, Python and TypeScript client libraries in sdk/ on every pull
# request that touches them, against the shared vectors in sdk/testdata, and
# releases each one on its own tag prefix:
#
#   sdk/go/vX.Y.Z  Go module github.com/ConductionNL/keepiq/sdk/go (the tag is
#                  the release; the Go proxy serves it)
#   sdk-py-vX.Y.Z  keepiq-sdk on PyPI, through trusted publishing
#   sdk-js-vX.Y.Z  @conduction/keepiq-sdk on npm, with provenance
#
# On a pull request the package jobs build the Python distribution and the npm
# tarball without publishing them: that is the dry run.

on:
  push:
    branches: [main, development]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
    tags: ["sdk/go/v*", "sdk-py-v*", "sdk-js-v*"]
  pull_request:
    branches: [main, development, beta]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # Stdlib-only Go; the RSA-4096 key generation in the tests is the slow part.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: sdk/go
        run: |
          go vet ./...
          go test ./...
      - name: Go release tag matches the module
        if: startsWith(github.ref, 'refs/tags/sdk/go/v')
        run: |
          grep -qx 'module github.com/ConductionNL/keepiq/sdk/go' sdk/go/go.mod
          echo "Released ${GITHUB_REF_NAME}; consumers fetch it with go get github.com/ConductionNL/keepiq/sdk/go@${GITHUB_REF_NAME#sdk/go/}"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest
          python -m pytest -q

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: sdk/js
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

  python-package:
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ startsWith(github.ref, 'refs/tags/sdk-py-v') && 'pypi' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-py-v')
        working-directory: sdk/python
        run: |
          want="${GITHUB_REF_NAME#sdk-py-v}"
          got="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$got" || { echo "::error::tag says $want, pyproject.toml says $got"; exit 1; }
      - name: Publish to PyPI (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/sdk-py-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  js-package:
    needs: js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Build
        working-directory: sdk/js
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm pack --dry-run
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-js-v')
        working-directory: sdk/js
        run: |
          want="${GITHUB_REF_NAME#sdk-js-v}"
          got="$(node -p 'require("./package.json").version')"
          test "$want" = "$got" || { echo "::error::tag says $want, package.json says $got"; exit 1; }
      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/sdk-js-v')
        working-directory: sdk/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
