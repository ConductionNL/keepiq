# Keepiq SIEM audit export: the keepiq:audit sourcetype.
#
# Keepiq posts each audit event to the HTTP Event Collector event endpoint
# with "time" in the envelope, so Splunk takes the timestamp from there and
# needs no timestamp extraction. The event is JSON; fields are extracted at
# search time.
[keepiq:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Authentication
description = Keepiq audit events (sanitized metadata only)
pulldown_type = true
