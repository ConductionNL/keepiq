# The KeepiqSecret resource: which Keepiq secrets and fields go into which
# Kubernetes Secret, how often they are refreshed, and what restarts on change.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keepiqsecrets.keepiq.conduction.nl
spec:
  group: keepiq.conduction.nl
  names:
    kind: KeepiqSecret
    listKind: KeepiqSecretList
    plural: keepiqsecrets
    singular: keepiqsecret
    shortNames: [kqs]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.target.name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [connectionRef, target, items]
              properties:
                connectionRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                target:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                refreshInterval:
                  type: string
                  default: 60s
                  maxLength: 32
                  description: How often each item is polled, for example 60s or 5m. At least 10s.
                  x-kubernetes-validations:
                    - rule: "duration(self) >= duration('10s')"
                      message: refreshInterval must be at least 10s
                restartTargets:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind:
                        type: string
                        enum: [Deployment, StatefulSet]
                      name: {type: string, minLength: 1}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, field, targetKey]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: The exact Keepiq secret name.
                      folder:
                        type: string
                        description: Narrows the name to a slash-separated folder path.
                      field:
                        type: string
                        description: key, login, or additionalFields.<name>.
                        pattern: '^(key|login|additionalFields\.[A-Za-z0-9_.-]+)$'
                      targetKey:
                        type: string
                        description: The key in the target Kubernetes Secret.
                        maxLength: 253
                        pattern: '^[-._a-zA-Z0-9]+$'
                  maxItems: 64
                  # Every item needs its own targetKey: the API server refuses
                  # two items with the same one.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [targetKey]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
