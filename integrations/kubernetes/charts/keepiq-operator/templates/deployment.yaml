apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keepiq-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keepiq-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "keepiq-operator.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keepiq-operator.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "keepiq-operator.serviceAccount" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if not .Values.clusterWide }}
            - --watch-namespace={{ .Release.Namespace }}
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - --leader-elect
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
