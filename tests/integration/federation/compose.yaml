#
# Two Nextcloud 35 instances on one network for the federated sharing test
# (sharing-federated-recipients task 5.1). A is http://localhost:8101, B is
# http://localhost:8102, from the host and from each other (see
# peer-proxy.sh). Bring up with:
#
#   docker compose -p kq-fed -f tests/integration/federation/compose.yaml up -d
#
# then run setup.sh with the app directory to install.

x-db: &db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: nextcloud
    POSTGRES_USER: nextcloud
    POSTGRES_PASSWORD: nextcloud

x-nc: &nc
  image: nextcloud:35-apache
  entrypoint: ["/bin/bash", "/federation/peer-proxy.sh"]
  command: ["apache2-foreground"]

services:
  db-a:
    <<: *db
    volumes: [db-a:/var/lib/postgresql/data]
  db-b:
    <<: *db
    volumes: [db-b:/var/lib/postgresql/data]

  nc-a:
    <<: *nc
    depends_on: [db-a]
    ports: ["8101:8101"]
    environment:
      POSTGRES_HOST: db-a
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:8101
      SELF_PORT: "8101"
      PEER_PORT: "8102"
      PEER_HOST: nc-b
    volumes:
      - nc-a:/var/www/html
      - ./peer-proxy.sh:/federation/peer-proxy.sh:ro

  nc-b:
    <<: *nc
    depends_on: [db-b]
    ports: ["8102:8102"]
    environment:
      POSTGRES_HOST: db-b
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:8102
      SELF_PORT: "8102"
      PEER_PORT: "8101"
      PEER_HOST: nc-a
    volumes:
      - nc-b:/var/www/html
      - ./peer-proxy.sh:/federation/peer-proxy.sh:ro

volumes:
  db-a:
  db-b:
  nc-a:
  nc-b:
