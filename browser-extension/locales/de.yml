  folderChanged: Dieser Ordner hat sich geändert. Prüfe die Auswahl erneut.
  offline: Der Server ist nicht erreichbar
  serverError: Keepiq ist gerade nicht verfügbar, versuche es später erneut
  unreadable: Dieser Eintrag konnte nicht gelesen werden und kann hier daher nicht bearbeitet werden
  restricted: Dieser Eintrag wurde mit Einschränkungen mit dir geteilt und kann hier daher nicht geändert oder kopiert werden
  unmatched: Keepiq hat eine Version dieses Eintrags gesendet, die dein Tresor nicht enthält, daher wurde er nicht geöffnet.
  keyMismatch: Keepiq hat einen Verschlüsselungsschlüssel gesendet, der nicht zu deinem Tresor passt, daher wurde nichts gespeichert. Wende dich an deine Keepiq-Administration.
  staleSource: Das Original dieses geteilten Eintrags wurde geändert, nachdem du ihn geöffnet hast. Es wurde nichts gespeichert; öffne ihn erneut und wiederhole deine Änderung.
  incomplete: Die Personen, mit denen dieser Eintrag geteilt ist, haben sich während des Speicherns ständig geändert. Es wurde nichts gespeichert; bitte versuche es erneut.
  badCertificate: Keepiq hat für eine Person, mit der dieser Eintrag geteilt ist, einen Verschlüsselungsschlüssel gesendet, den dieser Browser nicht lesen konnte. Es wurde nichts gespeichert.
  unverified: Dieser Eintrag ist mit Partnerorganisationen geteilt, und dieser Browser kann nicht bestätigen, dass sie ihn genau so erhalten, wie du ihn gesehen hast. Es wurde nichts gespeichert; nimm diese Änderung in der Keepiq-Web-App vor.
  partnerUnreachable: "Es wurde nichts gespeichert: Eine Partnerorganisation, mit der dieser Eintrag geteilt ist, ist nicht erreichbar ({cloudIds}). Versuche es später erneut oder speichere ohne sie. Dann wird das Teilen dieses Eintrags mit ihr pausiert, bis du ihn erneut mit ihr teilst."
  partnerUpgradeRequired: "Es wurde nichts gespeichert: Das Keepiq von {cloudIds} ist zu alt, um einen Authentifizierungsschlüssel zu empfangen. Entferne den Schlüssel oder bitte sie, Keepiq zu aktualisieren."
  partnerUpgradeRequiredUnnamed: "Es wurde nichts gespeichert: Eine Partnerorganisation, mit der dieser Eintrag geteilt ist, nutzt ein Keepiq, das zu alt ist, um einen Authentifizierungsschlüssel zu empfangen. Entferne den Schlüssel oder bitte sie, Keepiq zu aktualisieren."
  partnerUpgradeVersion: Sie brauchen Keepiq {version} oder neuer.
  partnerLookupLimit: Zu viele Partnerabfragen. Es wurde nichts gespeichert; versuche es in einer Minute erneut.
  federationUnavailable: Dein Keepiq-Server kann nicht mit Partnerorganisationen teilen, daher kann dieser Eintrag hier nicht gespeichert werden. Es wurde nichts gespeichert; wende dich an deine Administration.
  keepiqOutdated: Dein Keepiq-Server ist zu alt, um diese Änderung zu speichern. Es wurde nichts gespeichert; bitte deine Administration, Keepiq auf Version {version} oder neuer zu aktualisieren.
  partnerClock: Das Zertifikat einer Partnerorganisation, mit der dieser Eintrag geteilt ist, ist laut der Uhr dieses Computers nicht gültig. Es wurde nichts gespeichert; prüfe Datum und Uhrzeit dieses Computers oder nimm diese Änderung in der Keepiq-Web-App vor.
  shareScanPending: Dieser Eintrag wartet auf eine noch nicht abgeschlossene Prüfung seiner Freigaben. Es wurde nichts gespeichert; versuche es später erneut.
  shareScanPendingOpen: Dieser Eintrag wartet auf eine Prüfung seiner Freigaben und kann noch nicht bearbeitet werden. Versuche es später erneut.
  shareScanPendingDelete: Dieser Eintrag wartet auf eine noch nicht abgeschlossene Prüfung seiner Freigaben. Es wurde nichts gelöscht; versuche es später erneut.
  sendInvalid: Keepiq hat diese Sendung nicht akzeptiert. Es wurde nichts gesendet; prüfe die Felder und versuche es erneut.
  sendOffline: Der Server ist nicht erreichbar, es wurde nichts gesendet
  argon2Unavailable: Passwortschutz ist in diesem Browser nicht verfügbar

