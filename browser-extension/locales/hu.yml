  badCertificate: A Keepiq egy olyan titkosítási kulcsot küldött az elem egyik címzettjéhez, amelyet ez a böngésző nem tudott beolvasni. Semmi sem lett mentve.
  unverified: Ez az elem partnerszervezetekkel van megosztva, és ez a böngésző nem tudja megerősíteni, hogy pontosan úgy kapnák meg, ahogy te láttad. Semmi sem lett mentve; ezt a módosítást a Keepiq webalkalmazásban végezd el.
  partnerUnreachable: "Semmi sem lett mentve: egy partnerszervezet, amellyel az elem meg van osztva, nem érhető el ({cloudIds}). Próbáld újra később, vagy mentsd nélkülük, ami szünetelteti velük a megosztást, amíg újra meg nem osztod velük."
  partnerUpgradeRequired: "Semmi sem lett mentve: a Keepiq túl régi ezeknél a hitelesítőkulcs fogadásához: {cloudIds}. Távolítsd el a kulcsot, vagy kérd meg őket, hogy frissítsék a Keepiqet."
  partnerUpgradeRequiredUnnamed: "Semmi sem lett mentve: egy partnerszervezet, amellyel az elem meg van osztva, túl régi Keepiqet futtat a hitelesítőkulcs fogadásához. Távolítsd el a kulcsot, vagy kérd meg őket, hogy frissítsék a Keepiqet."
  partnerUpgradeVersion: Keepiq {version} vagy újabb kell nekik.
  partnerLookupLimit: Túl sok partnerkeresés. Semmi sem lett mentve; próbáld újra egy perc múlva.
  federationUnavailable: A Keepiq-kiszolgálód nem tud partnerszervezetekkel megosztani, ezért ez az elem itt nem menthető. Semmi sem lett mentve; kérdezd meg a rendszergazdát.
  keepiqOutdated: A Keepiq-kiszolgálód túl régi ennek a módosításnak a mentéséhez. Semmi sem lett mentve; kérd meg a rendszergazdát, hogy frissítse a Keepiqet {version} vagy újabb verzióra.
  partnerClock: Egy partnerszervezet tanúsítványa, amellyel az elem meg van osztva, a számítógép órája szerint nem érvényes. Semmi sem lett mentve; ellenőrizd a számítógép dátumát és idejét, vagy végezd el a módosítást a Keepiq webalkalmazásban.
  shareScanPending: Az elem megosztásainak ellenőrzése még nem fejeződött be. Semmi sem lett mentve; próbáld újra később.
