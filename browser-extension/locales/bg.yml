  staleSource: Оригиналът на този споделен елемент е променен, след като го отворихте. Нищо не беше запазено; отворете го отново и повторете промяната.
  incomplete: Хората, с които е споделен този елемент, се променяха по време на запазването. Нищо не беше запазено; опитайте отново.
  badCertificate: За някого, с когото е споделен този елемент, Keepiq изпрати ключ за шифроване, който този браузър не можа да прочете. Нищо не беше запазено.
  unverified: Този елемент е споделен с партньорски организации и този браузър не може да потвърди, че те биха го получили точно такъв, какъвто сте го видели. Нищо не беше запазено; направете промяната в уеб приложението на Keepiq.
  partnerUnreachable: "Нищо не беше запазено: партньорска организация, с която е споделен този елемент, е недостъпна ({cloudIds}). Опитайте отново по-късно или запазете без тях, което спира споделянето на този елемент с тях, докато не го споделите отново с тях."
  partnerUpgradeRequired: "Нищо не беше запазено: Keepiq на {cloudIds} е твърде стар, за да получи ключ на удостоверителя. Премахнете ключа или ги помолете да обновят Keepiq."
  partnerUpgradeRequiredUnnamed: "Нищо не беше запазено: партньорска организация, с която е споделен този елемент, използва твърде стар Keepiq, за да получи ключ на удостоверителя. Премахнете ключа или ги помолете да обновят Keepiq."
  partnerUpgradeVersion: Нужен им е Keepiq {version} или по-нов.
  partnerLookupLimit: Твърде много търсения на партньори. Нищо не беше запазено; опитайте отново след минута.
  federationUnavailable: Вашият сървър на Keepiq не може да споделя с партньорски организации, затова този елемент не може да бъде запазен тук. Нищо не беше запазено; обърнете се към администратора.
  keepiqOutdated: Вашият сървър на Keepiq е твърде стар, за да запази тази промяна. Нищо не беше запазено; помолете администратора да обнови Keepiq до версия {version} или по-нова.
  partnerClock: Сертификатът на партньорска организация, с която е споделен този елемент, не е валиден според часовника на този компютър. Нищо не беше запазено; проверете датата и часа на компютъра или направете промяната в уеб приложението на Keepiq.
  shareScanPending: Този елемент чака проверка на споделянията си, която още не е завършила. Нищо не беше запазено; опитайте отново по-късно.
  shareScanPendingOpen: Този елемент чака проверка на споделянията си и още не може да се редактира. Опитайте отново по-късно.
  shareScanPendingDelete: Този елемент чака проверка на споделянията си, която още не е завършила. Нищо не беше изтрито; опитайте отново по-късно.
  sendInvalid: Keepiq не прие тази пратка. Нищо не беше изпратено; проверете полетата и опитайте отново.
