# Terms and tone follow Nextcloud and mainstream password managers: formal dumneavoastră (dvs.), noun-style buttons (Salvare), seif, parolă principală, parolă de aplicație, cheie de acces, autentificare; counts above 1 are phrased as "Elemente: $1" to avoid "de".
