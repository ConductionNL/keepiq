  partnerUpgradeVersion: Il leur faut Keepiq {version} ou ultérieur.
  partnerLookupLimit: Trop de recherches de partenaires. Rien n’a été enregistré ; réessayez dans une minute.
  federationUnavailable: Votre serveur Keepiq ne peut pas partager avec des organisations partenaires, cet élément ne peut donc pas être enregistré ici. Rien n’a été enregistré ; contactez votre administrateur.
  keepiqOutdated: Votre serveur Keepiq est trop ancien pour enregistrer cette modification. Rien n’a été enregistré ; demandez à votre administrateur de mettre Keepiq à jour vers la version {version} ou ultérieure.
  partnerClock: Le certificat d’une organisation partenaire avec qui cet élément est partagé n’est pas valide selon l’horloge de cet ordinateur. Rien n’a été enregistré ; vérifiez la date et l’heure de cet ordinateur, ou effectuez cette modification dans l’application web Keepiq.
  shareScanPending: Cet élément attend une vérification de ses partages qui n’est pas terminée. Rien n’a été enregistré ; réessayez plus tard.
  shareScanPendingOpen: Cet élément attend une vérification de ses partages et ne peut pas encore être modifié. Réessayez plus tard.
  shareScanPendingDelete: Cet élément attend une vérification de ses partages qui n’est pas terminée. Rien n’a été supprimé ; réessayez plus tard.
  sendInvalid: Keepiq n’a pas accepté cet envoi. Rien n’a été envoyé ; vérifiez les champs et réessayez.
  sendOffline: Impossible de joindre le serveur, rien n’a été envoyé
