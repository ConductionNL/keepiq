# Terms and tone follow Nextcloud's Greek: formal εσείς, κρύπτη, κύριος κωδικός πρόσβασης, κωδικός εφαρμογής, κλειδί πρόσβασης (passkey), εφαρμογή ιστού.
language: el
extensionDescription: "Το Keepiq στο πρόγραμμα περιήγησης: στοιχεία σύνδεσης, κλειδιά πρόσβασης και κωδικοί μίας χρήσης από την κρύπτη σας στο Nextcloud."
commandAutofillLogin: Αυτόματη συμπλήρωση της τελευταίας σύνδεσης
commandFocusNotificationBar: Μετάβαση στη γραμμή αποθήκευσης του Keepiq

