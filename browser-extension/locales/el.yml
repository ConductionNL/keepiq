  unverified: Αυτό το στοιχείο είναι κοινόχρηστο με συνεργαζόμενους οργανισμούς και αυτό το πρόγραμμα περιήγησης δεν μπορεί να επιβεβαιώσει ότι θα το λάβουν ακριβώς όπως το είδατε. Δεν αποθηκεύτηκε τίποτα· κάντε αυτήν την αλλαγή στην εφαρμογή ιστού του Keepiq.
  partnerUnreachable: "Δεν αποθηκεύτηκε τίποτα: ένας συνεργαζόμενος οργανισμός με τον οποίο είναι κοινόχρηστο αυτό το στοιχείο δεν είναι προσβάσιμος ({cloudIds}). Δοκιμάστε ξανά αργότερα ή αποθηκεύστε χωρίς αυτόν, οπότε η κοινή χρήση του στοιχείου μαζί του παύει μέχρι να το κοινοποιήσετε ξανά."
  partnerUpgradeRequired: "Δεν αποθηκεύτηκε τίποτα: το Keepiq του {cloudIds} είναι πολύ παλιό για να λάβει κλειδί επαλήθευσης. Αφαιρέστε το κλειδί ή ζητήστε τους να ενημερώσουν το Keepiq."
