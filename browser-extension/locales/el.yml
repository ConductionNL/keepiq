notices:
  keyChanged: Το κλειδί της κρύπτης σας άλλαξε στο Keepiq. Ξεκλειδώστε με τον τρέχοντα κύριο κωδικό πρόσβασης.
  fileAccess: "Το Keepiq δεν χρειάζεται πρόσβαση σε αρχεία. Στο Nextcloud, στις Ρυθμίσεις, Ασφάλεια, Συσκευές και συνεδρίες, μπορείτε να απενεργοποιήσετε την πρόσβαση σε αρχεία για αυτόν τον κωδικό εφαρμογής ή να τον ανακαλέσετε."

