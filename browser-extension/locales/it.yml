  partnerClock: Il certificato di un’organizzazione partner con cui è condiviso questo elemento non è valido secondo l’orologio di questo computer. Non è stato salvato nulla; controlla data e ora di questo computer oppure esegui la modifica nell’app web di Keepiq.
