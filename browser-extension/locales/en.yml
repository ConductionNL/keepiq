# The source catalog. Every key here must exist in every other catalog; locales.test.ts checks it.
# The BCP 47 tag of this catalog, for dates, numbers and `<html lang>`.
language: en
extensionDescription: Browser extension for Keepiq, the encrypted secrets manager for Nextcloud. Fill in logins, passkeys and one-time codes on any site, and save new ones as you go. Everything is encrypted — your master password and your secrets never reach the server.

errors:
  insecureUrl: Use https for this server
  invalidUrl: Enter a valid server URL
  permissionDenied: Keepiq needs permission to reach {host}
  unreachable: Could not reach {host}
  notNextcloud: "{host} does not look like a Nextcloud server"
  serverError: "{host} is unavailable right now, try again later"
  unauthorized: Wrong username or app password
  keepiqMissing: Keepiq is not installed on {host}
  noActiveSuite: Open the Keepiq web app once and set a master password, then try again
  unlockBlocked: Your organisation requires two-factor login. Set up a second factor in Nextcloud Settings, Security, then try again
  duplicate: This account is already added
  limitReached: Maximum of {count} accounts reached
  invalidMasterPassword: Invalid master password
  offlineNoCache: You are offline and this vault has not been synced yet
  sessionRevoked: Session revoked, please log in again
  writeLocked: Your vault cannot be changed right now, try again later
  notResponding: Keepiq is not responding. Reload the extension and reopen this popup.
  unknown: Something went wrong

