# The save and update bar at the top of the web page.
notificationBar:
  label: Keepiq notification
  saveQuestion: Save login for {host} to Keepiq?
  updateQuestion: Update password for {name}?
  updateQuestionUser: Update password for {name} ({username})?
  updateQuestionHost: Update password for {name} on {host}?
  updateQuestionUserHost: Update password for {name} ({username}) on {host}?
  folder: Folder
  noFolder: No folder
  save: Save
  never: Never for this site
  update: Update
  close: Close
  expand: Show options
  shortcutHint: Press {shortcut} to answer.
  saving: Saving…
  updating: Updating…
  saved: Login saved
  updated: Password updated
  notVisible: Keepiq can't do this here because this page changes how it is shown. Close this and add the login from the Keepiq button in the toolbar.
  errors:
    writeLocked: The vault is temporarily locked for changes. Try again later.
    unverified: Edit this login in the Keepiq popup or web app to change its password.
    viewOnly: This login is shared with you to view only, so its password can't be updated here.
    loginGone: This login no longer exists. Save it as a new login?
    locked: Keepiq is locked. Unlock it from the Keepiq button in the toolbar, then try again.
    notResponding: Keepiq is not responding. Try again.
    # Shorter than their `writeErrors` namesakes, to fit the bar's three lines.
    accountChanged: You switched accounts, so nothing was saved.
    keyMismatch: Keepiq's key does not match your vault. Nothing was saved; tell your administrator.
    staleSource: The original of this shared login changed. Nothing was saved; try again.
    incomplete: The people this login is shared with kept changing. Nothing was saved; try again.
    badCertificate: A recipient's encryption key could not be read. Nothing was saved.
    keepiqOutdated: Your Keepiq server is too old. Nothing was saved; ask your administrator for Keepiq {version} or later.
