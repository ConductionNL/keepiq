# Shown in the web page by the content script.
pageFill:
  insecure: "Warning: This is an unsecured HTTP page, and any information you submit can potentially be seen and changed by others. This login was originally saved on a secure (HTTPS) page, {host}.\n\nDo you still wish to fill this login?"
