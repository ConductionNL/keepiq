  unauthorized: Wrong username or app password
  keepiqMissing: Keepiq is not installed on {host}
  keepiqOutdated: Keepiq on {host} is too old for this extension, which needs version {version} or later. Ask your administrator to update Keepiq.
  noActiveSuite: Open the Keepiq web app once and set a master password, then try again
  unlockBlocked: Your organisation requires two-factor login. Set up a second factor in Nextcloud Settings, Security, then try again
  duplicate: This account is already added
  limitReached: Maximum of {count} accounts reached
  invalidMasterPassword: Invalid master password
  keyUnreadable: Your vault key in Keepiq could not be read, so this browser can't unlock it. Tell your Keepiq administrator.
