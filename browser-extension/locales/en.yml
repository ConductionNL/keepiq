writeErrors:
  writeLocked: Vault is temporarily locked for a key migration, try again later
  forbidden: Keepiq does not allow this change. The Keepiq web app shows why.
  policy: Your organisation's policy does not allow this change
  accountChanged: You switched to another account meanwhile, so nothing was saved. Switch back to save it.
  keepClash: A folder named {name} already exists one level up. Choose Move items to parent or Delete for it, or rename one of them first.
  keepClashAfter: A folder you chose to keep has the same name as one a level up, so nothing was deleted. Check the choices again.
  invalid: Keepiq refused this change
  stale: This item was changed elsewhere. Go back and edit it again to see the latest version.
  itemGone: This item no longer exists
  folderGone: This folder no longer exists
  duplicateFolder: A folder with this name already exists here
  folderChanged: This folder changed. Check the choices again.
  offline: Could not reach the server
  serverError: Keepiq is unavailable right now, try again later
  unreadable: Could not read this item, so it cannot be edited here
  restricted: This item was shared with you with limits, so it cannot be changed or copied here
  unmatched: Keepiq sent a version of this item that your vault does not hold, so it was not opened.
  keyMismatch: Keepiq sent an encryption key that does not match your vault, so nothing was saved. Tell your Keepiq administrator.
  staleSource: The original of this shared item was changed after you opened it. Nothing was saved; open it again and redo your change.
  incomplete: The people this item is shared with kept changing while it was saved. Nothing was saved; please try again.
  badCertificate: Keepiq sent an encryption key for someone this item is shared with that this browser could not read. Nothing was saved.
  unverified: This item is shared with partner organisations, and this browser can't confirm they would get it exactly as you saw it. Nothing was saved; make this change in the Keepiq web app.
  partnerUnreachable: "Nothing was saved: a partner organisation this item is shared with can't be reached ({cloudIds}). Try again later, or save without them, which pauses sharing this item with them until you share it with them again."
  partnerLookupLimit: Too many partner lookups. Nothing was saved; try again in a minute.
  federationUnavailable: Your Keepiq server can't share with partner organisations, so this item can't be saved here. Nothing was saved; ask your administrator.
  keepiqOutdated: Your Keepiq server is too old to save this change. Nothing was saved; ask your administrator to update Keepiq to version {version} or later.
  partnerClock: The certificate of a partner organisation this item is shared with isn't valid by this computer's clock. Nothing was saved; check this computer's date and time, or make this change in the Keepiq web app.

shareSave:
  saveWithout: Save without them
  ownerOnly: Saved. Recipients at partner organisations get this change when the owner next saves it.
  suspended: Sharing with {cloudIds} is paused, because their certificate could not be verified or their organisation no longer accepts it. The Keepiq web app shows the share.
  paused: Sharing with {cloudIds} is paused until you share this item with them again.

