#
# One Nextcloud with Keepiq and OpenRegister, for capturing the browser
# extension's screenshots and videos (browser-extension/capture/). PostgreSQL,
# because Keepiq's migrations use json columns that SQLite refuses.
#
#   docker compose -p kq-media -f browser-extension/capture/compose.yaml up -d
#   bash browser-extension/capture/setup.sh kq-media . <openregister dir>
#
# KQ_MEDIA_PORT moves the port (8188 by default). KQ_MEDIA_NC_IMAGE and
# KQ_MEDIA_DB_IMAGE swap the images, for a machine that already has another
# Nextcloud 32 to 35 or PostgreSQL 16 image.
# Tear down with `down -v`.

services:
    db:
        image: ${KQ_MEDIA_DB_IMAGE:-postgres:16-alpine}
        environment:
            POSTGRES_DB: nextcloud
            POSTGRES_USER: nextcloud
            POSTGRES_PASSWORD: nextcloud
        volumes: [db:/var/lib/postgresql/data]

    nc:
        image: ${KQ_MEDIA_NC_IMAGE:-nextcloud:35-apache}
        depends_on: [db]
        ports: ['${KQ_MEDIA_PORT:-8188}:80']
        environment:
            POSTGRES_HOST: db
            POSTGRES_DB: nextcloud
            POSTGRES_USER: nextcloud
            POSTGRES_PASSWORD: nextcloud
            NEXTCLOUD_ADMIN_USER: admin
            NEXTCLOUD_ADMIN_PASSWORD: admin
            NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:${KQ_MEDIA_PORT:-8188}
        volumes:
            - nc:/var/www/html

volumes:
    db:
    nc:
