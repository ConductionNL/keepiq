<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Multi-step login, password</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>Multi-step login</h1>
		<p class="tests">Step 2 of 2: the password, with the username kept in a hidden field as many sites do.</p>
		<form method="post" action="/multi-step">
			<input name="username" type="hidden" autocomplete="username">
			<p id="who" class="status"></p>
			<label>Password <input name="password" type="password" autocomplete="current-password"></label>
			<button type="submit">Sign in</button>
		</form>
	</main>
	<script>
		const username = new URLSearchParams(location.search).get('username') ?? ''
		document.querySelector('input[name="username"]').value = username
		document.getElementById('who').textContent = username ? `Signing in as ${username}` : ''
	</script>
</body>
</html>
