<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>One-time code in two halves</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>One-time code in two halves</h1>
		<p class="tests">The code split over two inputs of three, with a dash between them. A fill puts three digits in each. The code is checked against the key on <a href="/totp-setup.html">Two-step setup</a>.</p>
		<form method="post" action="/otp">
			<fieldset class="code-group">
				<legend>Authentication code</legend>
				<input name="code1" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="3" aria-label="Authentication code, first half" data-code>
				<span aria-hidden="true">-</span>
				<input name="code2" type="text" inputmode="numeric" maxlength="3" aria-label="Authentication code, second half" data-code>
			</fieldset>
			<button type="submit">Verify</button>
			<p class="status" role="status"></p>
		</form>
	</main>
	<script type="module">
		import { checkCodeForm } from '/totp.js'
		checkCodeForm(document.querySelector('form'))
	</script>
</body>
</html>
