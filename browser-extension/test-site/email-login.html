<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Email login</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>Email login</h1>
		<p class="tests">An email field with <code>autocomplete</code> hints and a checkbox that must stay untouched.</p>
		<form method="post" action="/email-login">
			<label>Email address <input name="email" type="email" autocomplete="username"></label>
			<label>Password <input name="pass" type="password" autocomplete="current-password"></label>
			<label class="inline"><input name="remember" type="checkbox"> Remember me</label>
			<button type="submit">Log in</button>
		</form>
	</main>
</body>
</html>
