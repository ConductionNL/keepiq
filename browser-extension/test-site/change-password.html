<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change password</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>Change password</h1>
		<p class="tests">Use a saved username here: the update bar should offer to replace the stored password.</p>
		<form method="post" action="/change-password">
			<label>Username <input name="username" type="text" autocomplete="username"></label>
			<label>Current password <input name="current" type="password" autocomplete="current-password"></label>
			<label>New password <input name="new" type="password" autocomplete="new-password"></label>
			<label>Confirm new password <input name="confirm" type="password" autocomplete="new-password"></label>
			<button type="submit">Change password</button>
		</form>
	</main>
</body>
</html>
