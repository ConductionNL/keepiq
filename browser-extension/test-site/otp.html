<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>One-time code</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>One-time code</h1>
		<p class="tests">The second step after a password, with one field marked <code>one-time-code</code>. The code is checked against the key on <a href="/totp-setup.html">Two-step setup</a>.</p>
		<form method="post" action="/otp">
			<label>Authentication code <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-code></label>
			<button type="submit">Verify</button>
			<p class="status" role="status"></p>
		</form>
	</main>
	<script type="module">
		import { checkCodeForm } from '/totp.js'
		checkCodeForm(document.querySelector('form'))
	</script>
</body>
</html>
