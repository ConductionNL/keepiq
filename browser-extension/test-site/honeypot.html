<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hidden honeypot field</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>Hidden honeypot field</h1>
		<p class="tests">The form has a password field you cannot see. Only the visible one may be filled; the status below says if the hidden one got a value.</p>
		<form method="post" action="/honeypot">
			<label>Username <input name="username" type="text"></label>
			<input name="trap" type="password" tabindex="-1" aria-hidden="true" style="position: absolute; left: -9999px">
			<input name="trap2" type="password" hidden>
			<label>Password <input name="password" type="password"></label>
			<button type="submit">Sign in</button>
			<p id="status" class="status"></p>
		</form>
	</main>
	<script>
		const traps = document.querySelectorAll('input[name^="trap"]')
		const status = document.getElementById('status')
		setInterval(() => {
			const filled = [...traps].filter((input) => input.value)
			status.textContent = filled.length ? `Hidden field filled: ${filled.map((i) => i.name).join(', ')}` : 'Hidden fields are empty'
		}, 300)
	</script>
</body>
</html>
