<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login without a form</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main>
		<a class="back" href="/">All test pages</a>
		<h1>Login without a form</h1>
		<p class="tests">No <code>&lt;form&gt;</code> element: the button sends the login with <code>fetch</code> and the page changes without navigating. Capture has to rely on the button click or Enter.</p>
		<div class="card" id="login">
			<label>Username <input id="username" type="text"></label>
			<label>Password <input id="password" type="password"></label>
			<button type="button" id="submit">Sign in</button>
		</div>
		<div class="card" id="done" hidden>
			<p>Signed in without leaving the page.</p>
		</div>
	</main>
	<script>
		const submit = async () => {
			await fetch('/api/login', {
				method: 'POST',
				body: JSON.stringify({
					username: document.getElementById('username').value,
					password: document.getElementById('password').value,
				}),
			})
			document.getElementById('login').hidden = true
			document.getElementById('done').hidden = false
			history.pushState({}, '', '/spa.html#signed-in')
		}
		document.getElementById('submit').addEventListener('click', submit)
		document.getElementById('password').addEventListener('keydown', (event) => {
			if (event.key === 'Enter') submit()
		})
	</script>
</body>
</html>
