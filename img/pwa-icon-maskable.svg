<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed brand background so Android's adaptive mask never shows a gap. -->
  <rect width="512" height="512" fill="#21468B"/>
  <!-- Lock glyph centered within the inner ~60% safe zone (ample >20% padding
       so circular/squircle masks never clip it). Source glyph is a 24-unit
       viewBox scaled ~10.6x and translated to centre. -->
  <g transform="translate(128,128) scale(10.6667)" fill="#fff">
    <rect x="5" y="11" width="14" height="10" rx="2"/>
    <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M8,11V7a4,4,0,0,1,8,0v4"/>
  </g>
</svg>
