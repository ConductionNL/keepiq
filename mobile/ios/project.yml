#
# The iOS app as an XcodeGen spec (MIT licensed tool), so no generated
# .xcodeproj is kept in the tree. Build the shared framework first:
#   cd mobile && ./gradlew :shared:assembleKeepiqSharedDebugXCFramework
#   cd ios && xcodegen generate
# CI runs the UI tests in .github/workflows/mobile-e2e.yml.
name: Keepiq
options:
  bundleIdPrefix: nl.conduction
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator builds sign ad hoc; the release workflow (task 6.4) signs
    # with the Conduction team.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Keepiq:
    type: application
    platform: iOS
    sources:
      - Keepiq
      # Shared: the Keychain, the autofill index files and the AutoFill
      # screens, compiled into the app and its extension.
      - Shared
      # The vault, Send and generator screens: the KeepiqApp package's
      # sources and strings, built into the app. Keepiq/BundleModule.swift
      # points their Bundle.module at the main bundle.
      - KeepiqApp/Sources/KeepiqApp
    entitlements:
      path: Keepiq/Keepiq.entitlements
    dependencies:
      - target: KeepiqAutofill
        embed: true
      - framework: ../shared/build/XCFrameworks/debug/KeepiqShared.xcframework
        embed: false
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: AuthenticationServices.framework
      - sdk: libsqlite3.tbd
    info:
      path: Keepiq/Info.plist
      properties:
        CFBundleDisplayName: Keepiq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Keepiq uses Face ID to unlock your vault.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.conduction.keepiq
        # Keepiq/Assets.xcassets: one 1024 px icon, Xcode derives the rest.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # The Kotlin runtime in the static KeepiqShared framework is C++.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
  # The AutoFill credential provider extension (clients-mobile-apps task 4.4).
  KeepiqAutofill:
    type: app-extension
    platform: iOS
    sources: [KeepiqAutofill, Shared]
    entitlements:
      path: KeepiqAutofill/KeepiqAutofill.entitlements
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/KeepiqShared.xcframework
        embed: false
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: AuthenticationServices.framework
      - sdk: libsqlite3.tbd
    info:
      path: KeepiqAutofill/Info.plist
      properties:
        CFBundleDisplayName: Keepiq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Keepiq uses Face ID to unlock your vault.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              # Passkey assertion and registration (task 5.2, iOS 17).
              ProvidesPasskeys: true
              ShowsConfigurationUI: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.conduction.keepiq.autofill
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        APPLICATION_EXTENSION_API_ONLY: YES
  KeepiqUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KeepiqUITests]
    dependencies:
      - target: Keepiq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.conduction.keepiq.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Keepiq:
    build:
      targets:
        Keepiq: all
        KeepiqUITests: [test]
    test:
      config: Debug
      targets: [KeepiqUITests]
