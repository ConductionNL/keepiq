[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepiq-sdk"
version = "0.1.0"
description = "Client library for the Keepiq machine API: read and write an application's secrets, decrypted only in your process."
readme = "README.md"
license = { text = "EUPL-1.2" }
authors = [{ name = "Conduction B.V.", email = "info@conduction.nl" }]
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/ConductionNL/keepiq/tree/development/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
