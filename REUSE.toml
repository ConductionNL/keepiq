# REUSE / SPDX declaration for keepiq.
#
# `quality / REUSE compliance` (fsfe/reuse-action@v5, shared quality.yml) has
# been red on every run: the repo carried SPDX headers on its hand-written
# source — 329 files — but no LICENSES/ directory, so every
# `SPDX-License-Identifier: EUPL-1.2` in the tree pointed at a licence text
# that was not there, and the ~1140 files that carry no header at all (l10n
# JSON, openspec specs, docs, fixtures, images, lockfiles) had no licensing
# information by REUSE's definition.
#
# Headers on those 1140 files would be the other fix, and it is the wrong one:
# `l10n/*.json` is machine-generated and an SPDX comment is not valid JSON,
# and lockfiles are rewritten by the package managers. The blanket below is
# what the specification is for.
version = 1
SPDX-PackageName = "keepiq"
SPDX-PackageSupplier = "Conduction B.V. <info@conduction.nl>"
SPDX-PackageDownloadLocation = "https://github.com/ConductionNL/keepiq"

# Repo-wide default.
#
# `precedence = "closest"` means a file's OWN header always wins over this
# entry — including the two files that carry Nextcloud code and are
# AGPL-3.0-or-later: `.editorconfig`, and `webpack.config.js`, roughly half of
# whose config literal was inlined verbatim from
# `@nextcloud/webpack-vue-config` when that package was dropped to clear an
# unfixable `elliptic` advisory.
#
# It also fills in half a header: a file that declares a licence but no
# copyright (tests/e2e/visual/_visual-helpers.ts) takes the missing half from
# here rather than counting as non-compliant.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = "src/generator/eff-large-wordlist.js"
precedence = "override"
SPDX-FileCopyrightText = "2016 Electronic Frontier Foundation"
SPDX-License-Identifier = "CC-BY-3.0-US"

# The reference Argon2 C code (P-H-C/phc-winner-argon2, tag 20190702), linked
# into the iOS build of the mobile core through cinterop (clients-mobile-apps
# design D1). Unchanged upstream files; the authors offer CC0 or Apache 2.0.
[[annotations]]
path = "mobile/shared/src/nativeInterop/argon2/**"
precedence = "override"
SPDX-FileCopyrightText = "2015 Daniel Dinu, Dmitry Khovratovich, Jean-Philippe Aumasson, and Samuel Neves"
SPDX-License-Identifier = "CC0-1.0 OR Apache-2.0"
